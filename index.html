<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff7e8">
<title>香港茶餐廳</title>
<style>
  :root{
    --ink:#2f241c; --ink-soft:#6f5b4b; --cream:#fff7e8; --paper:#fffdf8;
    --red:#d94f3b; --red-deep:#a93424; --yellow:#ffc94d; --green:#1f7a4c;
    --green-soft:#e8f6ee; --blue:#3b6fb6; --blue-soft:#eaf2ff; --line:#e8d5b7;
    --shadow:0 14px 36px rgba(101,67,31,.13); --radius:22px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; min-height:100vh; color:var(--ink); font-size:18px; line-height:1.6;
    font-family:"PingFang HK","Microsoft JhengHei","Noto Sans TC","Segoe UI",system-ui,-apple-system,sans-serif;
    background-color:var(--cream);
    background-image:radial-gradient(circle at 12% 0%,rgba(255,201,77,.30),transparent 34rem),
      radial-gradient(circle at 95% 18%,rgba(31,122,76,.10),transparent 30rem),
      radial-gradient(rgba(104,71,37,.055) 1.2px,transparent 1.3px);
    background-size:auto,auto,26px 26px;
  }
  [hidden]{display:none !important}
  button,input,textarea,select{font-family:inherit;font-size:inherit}
  button{cursor:pointer}
  :focus-visible{outline:4px solid #3b6fb6;outline-offset:3px}
  body.modal-open{overflow:hidden}
  .awning{height:16px;background:repeating-linear-gradient(90deg,#d94f3b 0 46px,#fff3df 46px 92px);border-bottom:3px solid #b93a28}
  .page{width:min(1460px,97vw);margin:0 auto;padding:12px 0 24px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  .brand{display:flex;align-items:center;gap:14px;flex:1 1 280px;min-width:0}
  .brand-badge{width:66px;height:66px;flex:none;border-radius:20px;background:linear-gradient(145deg,#ffe4a8,#ffc94d);display:grid;place-items:center;font-size:36px;border:2px solid #e8b53f;box-shadow:inset 0 -4px 0 rgba(181,132,28,.18);transform:rotate(-3deg)}
  .brand h1{margin:0;font-size:clamp(26px,3.4vw,42px);line-height:1.15;letter-spacing:1px}
  .brand p{margin:6px 0 0;font-size:16px;color:var(--ink-soft)}
  .top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .icon-btn{border:2px solid var(--line);background:#fffaf0;color:var(--ink);border-radius:14px;padding:8px 13px;font-weight:800;font-size:15px;box-shadow:0 3px 0 var(--line);transition:transform .12s,background .12s}
  .icon-btn:hover{background:#fff1d6;transform:translateY(-1px)}
  .icon-btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--line)}
  .lang-toggle{display:flex;gap:4px;background:#fffaf0;border:2px solid var(--line);border-radius:14px;padding:4px}
  .lang-toggle button{border:0;background:transparent;border-radius:10px;padding:6px 11px;font-weight:900;font-size:14px;color:#7b6250}
  .lang-toggle button.active{background:var(--ink);color:#fff7ec}

  /* ===== 首页 ===== */
  .start-screen{min-height:calc(100vh - 22px);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px 0}
  .start-top{width:100%;justify-content:center;margin-bottom:4px}
  .start-screen .brand{flex:0 1 auto;justify-content:center}
  .start-screen .top-actions{justify-content:center;margin-top:12px;width:100%}
  .start-sub{margin:2px 0 0;font-size:18px;color:var(--ink-soft);text-align:center}
  .home-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:22px 0 6px}
  .home-btn{border:2px solid var(--line);background:#fffaf0;color:var(--ink);border-radius:16px;padding:12px 16px;font-weight:800;font-size:16px;box-shadow:0 3px 0 var(--line);display:inline-flex;align-items:center;gap:7px;transition:transform .12s}
  .home-btn:hover{background:#fff1d6;transform:translateY(-1px)}
  .home-btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--line)}
  .home-btn.primary{border-color:var(--red-deep);background:linear-gradient(180deg,#f97b4c,#ef5d32);color:#fff;box-shadow:0 4px 0 var(--red-deep)}
  .home-btn.primary:hover{background:linear-gradient(180deg,#fa8459,#f26a41)}

  .section-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:20px 4px 12px}
  .section-title h2{margin:0;font-size:clamp(22px,2.6vw,28px)}
  .level-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  .level-card{width:100%;text-align:left;font:inherit;color:inherit;background:var(--paper);border:3px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;gap:12px;transition:transform .15s,box-shadow .15s}
  .level-card:hover{transform:translateY(-4px);box-shadow:0 10px 0 var(--line)}
  .level-card.basic{border-color:#a9d9bd;box-shadow:0 6px 0 #a9d9bd}
  .level-card.advanced{border-color:#f0c27a;box-shadow:0 6px 0 #f0c27a}
  .level-card.challenge{border-color:#9fc1ee;box-shadow:0 6px 0 #9fc1ee}
  .level-card h3{margin:0;font-size:22px;line-height:1.25}
  .level-focus{background:#fff9ef;border:1.5px dashed #e2cfb2;border-radius:12px;padding:8px 10px;font-size:14.5px;font-weight:800;color:#6d4d2f;line-height:1.5}
  .level-time{font-size:15px;font-weight:900;color:#237a4c;text-align:center}
  .level-start{margin-top:auto;border:2px solid var(--red-deep);background:linear-gradient(180deg,#f97b4c,#ef5d32);color:#fff;border-radius:14px;padding:13px 16px;font-size:18px;font-weight:900;box-shadow:0 4px 0 var(--red-deep)}
  .level-start:hover{background:linear-gradient(180deg,#fa8459,#f26a41)}
  .level-start:active{transform:translateY(2px);box-shadow:0 2px 0 var(--red-deep)}
  .page-foot{text-align:center;color:#8a715c;font-size:15px;margin-top:30px}
  .level-art{width:100%;max-width:200px;height:120px;display:grid;place-items:center;background:radial-gradient(circle at 50% 44%,#fff3d6,#fffdf8 72%);border-radius:18px;border:1.5px dashed #e2cfb2;overflow:hidden;margin:0 auto}
  .level-art svg{width:100%;height:100%;display:block}

  /* ===== 营业主画面（一屏免滑动横向餐单 + 右侧餐盘） ===== */
  .game-topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(255,253,247,.97);border:2px solid var(--line);border-radius:16px;padding:7px 12px;box-shadow:0 6px 18px rgba(101,67,31,.10);margin-bottom:8px;backdrop-filter:blur(6px)}
  .game-topbar .brand{flex:0 1 auto;gap:10px}
  .game-topbar .brand h1{font-size:19px;letter-spacing:.5px}
  .game-topbar .brand-badge{width:38px;height:38px;font-size:21px;border-radius:11px}
  .level-badge{border-radius:999px;padding:5px 12px;font-weight:900;font-size:14px;background:#eef8f1;color:#237a4c;white-space:nowrap}
  .level-badge.advanced{background:#fff3d9;color:#9a5a0a}
  .level-badge.challenge{background:#eaf2ff;color:#2b5b9c}
  .game-topbar .top-actions{margin-left:auto}

  /* 营业信息栏 */
  .biz-bar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:8px}
  .biz-card{background:var(--paper);border:2px solid var(--line);border-radius:13px;padding:5px 10px;display:flex;align-items:center;justify-content:center;gap:8px}
  .biz-card .label{font-size:13px;font-weight:800;color:var(--ink-soft)}
  .biz-card .value{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15}
  .biz-card.timer .value{color:#1f7a4c}
  .biz-card.timer.warn .value{color:#d94f3b;animation:timerPulse 1.2s ease-in-out infinite}
  @keyframes timerPulse{0%,100%{opacity:1}50%{opacity:.55}}

  /* 客人 */
  .customer-box{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#fff3d9,#fffdf8);border:2.5px solid #f0d59c;border-radius:16px;padding:9px 14px;margin-bottom:10px;box-shadow:0 3px 0 #f0d59c}
  .customer-avatar{flex:none;width:54px;height:54px;border-radius:14px;background:#fff;border:2px solid #f0d59c;display:grid;place-items:center;overflow:hidden}
  .customer-avatar svg{width:100%;height:100%}
  .customer-speech{flex:1;min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .customer-name{margin:0;font-size:14.5px;font-weight:900;color:#9a5a0a;white-space:nowrap}
  .speech-bubble{position:relative;flex:1;min-width:240px;background:#fff;border:2px solid #f0d59c;border-radius:12px;padding:7px 12px;font-size:15.5px;color:#5f4837;line-height:1.4}
  .speech-bubble strong{color:#2f241c;font-weight:900}

  /* 横向餐单 + 右侧餐盘布局 */
  .game-layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(310px,.82fr);gap:14px;align-items:start}
  .menu-panel{min-width:0}
  .panel{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 4px 0 var(--line)}
  .panel + .panel{margin-top:10px}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
  .panel-head h2,.panel-head h3{margin:0;font-size:18px}
  .panel-head p{margin:0;font-size:13px;color:var(--ink-soft)}
  .filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .filter-btn{border:1.5px solid var(--line);background:#fffaf0;border-radius:999px;padding:4px 11px;font-size:13.5px;font-weight:800;color:#6d4d2f}
  .filter-btn.active{background:var(--ink);color:#fff7ec;border-color:var(--ink)}

  /* 6列横向紧凑食物网格：28种食物一屏全部显示 */
  .menu-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
  .food-card{background:var(--paper);border:2px solid #eeddc5;border-radius:12px;padding:6px;box-shadow:0 2px 0 #eeddc5;display:flex;flex-direction:column;gap:4px;transition:transform .12s,box-shadow .12s;min-width:0}
  .food-card:hover{transform:translateY(-2px);box-shadow:0 4px 0 #eeddc5}
  .food-card.in-cart{border-color:#f0b64e;box-shadow:0 2px 0 #f0d59c;background:#fffcf4}
  .food-top{display:flex;gap:6px;align-items:center;min-width:0}
  .food-emoji{width:34px;height:34px;flex:none;border-radius:10px;background:var(--food-bg,#fff1cf);display:grid;place-items:center;font-size:21px;border:1px solid rgba(90,55,20,.08)}
  .food-emoji svg{width:28px;height:28px}
  .food-title{min-width:0;flex:1}
  .food-head-line{display:flex;align-items:baseline;justify-content:space-between;gap:3px;min-width:0}
  .food-title h3{margin:0;font-size:14px;font-weight:900;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .price-now{font-size:14.5px;font-weight:900;color:#b93a28;flex:none;line-height:1}
  .pack-row{display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-width:0}
  .pack-badge{border-radius:8px;padding:2px 6px;font-size:11px;font-weight:800;line-height:1.25;border:1.5px solid #e8d5b7;background:#fff9ef;color:#6d4d2f;white-space:normal;word-break:keep-all}
  .pack-badge.eco-high,.tray-pack.eco-high{background:#e8f6ee;border-color:#9fd6b7;color:#1f7a4c}
  .pack-badge.eco-mid,.tray-pack.eco-mid{background:#fff6d6;border-color:#ebd07a;color:#8a5a0a}
  .pack-badge.eco-low,.tray-pack.eco-low{background:#fff1ee;border-color:#f0b3a8;color:#b93a28}
  .eco-legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:12.5px;font-weight:800}
  .eco-legend span{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;border:1.5px solid transparent}
  .eco-legend .leg-high{background:#e8f6ee;border-color:#9fd6b7;color:#1f7a4c}
  .eco-legend .leg-mid{background:#fff6d6;border-color:#ebd07a;color:#8a5a0a}
  .eco-legend .leg-low{background:#fff1ee;border-color:#f0b3a8;color:#b93a28}
  .tag-row{display:flex;gap:3px;flex-wrap:nowrap;overflow:hidden;margin-top:2px}
  .tag{background:#f4ecdf;color:#6d4d2f;border-radius:999px;padding:1px 6px;font-size:11px;font-weight:700;line-height:1.3;white-space:nowrap}
  .tag.healthy{background:#e8f6ee;color:#1f7a4c}
  .food-actions{display:flex;align-items:center;gap:5px;margin-top:auto}
  .add-btn{flex:1;border:1.5px solid var(--red-deep);background:linear-gradient(180deg,#f97b4c,#ef5d32);color:#fff;border-radius:9px;padding:4px 6px;font-weight:900;font-size:12.5px;box-shadow:0 2px 0 var(--red-deep);line-height:1.25}
  .add-btn:active{transform:translateY(1px);box-shadow:none}
  .add-btn.added{background:#eef8f1;color:#237a4c;border-color:#a9d9bd;box-shadow:0 2px 0 #a9d9bd}
  .qty-badge{font-size:12px;font-weight:900;color:#237a4c;white-space:nowrap}

  .side-panel{min-width:0;position:sticky;top:64px;max-height:calc(100vh - 76px);overflow:auto;padding-right:2px;scrollbar-width:thin;scrollbar-color:#e6d3b8 transparent}
  .side-panel::-webkit-scrollbar{width:6px}.side-panel::-webkit-scrollbar-thumb{background:#e6d3b8;border-radius:999px}

  .tray-list{display:flex;flex-direction:column;gap:7px}
  .empty-tray{border:2px dashed #e6d3b8;border-radius:14px;background:#fffbf3;padding:14px 10px;text-align:center;color:#a68a6e}
  .empty-tray b{display:block;font-size:16px;color:#806347;margin:3px 0 2px}
  .empty-tray span{font-size:13.5px}
  .tray-line{display:flex;gap:8px;align-items:center;background:#fffdf8;border:1.5px solid #f0e1cc;border-radius:12px;padding:7px 8px}
  .tray-emoji{font-size:24px;width:30px;text-align:center;flex:none}
  .tray-emoji svg{width:26px;height:26px}
  .tray-info{flex:1;min-width:0}
  .tray-name{font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tray-name small{font-size:13px;color:#8a7059;font-weight:700}
  .tray-pack{display:inline-block;font-size:11.5px;font-weight:800;color:#6d4d2f;margin-top:3px;padding:1px 7px;border-radius:8px;border:1px solid #e8d5b7;background:#fff9ef}
  .tray-side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
  .qty-control{display:flex;align-items:center;gap:4px}
  .qty-btn{width:28px;height:28px;border-radius:8px;border:1.5px solid #e2cfb2;background:#fff7e9;color:#63462d;font-size:16px;font-weight:900;display:grid;place-items:center;line-height:1;padding:0;box-shadow:0 2px 0 #e2cfb2}
  .qty-btn:active{transform:translateY(1px);box-shadow:none}
  .qty-btn:disabled{opacity:.4;cursor:not-allowed}
  .qty-num{min-width:18px;text-align:center;font-size:16px;font-weight:900}
  .remove-btn{border:0;background:none;color:#b06a50;font-size:12px;padding:1px 3px;border-radius:6px;font-weight:700}
  .remove-btn:hover{background:#fff0e8;color:#c94a27}

  .checkout-btn{width:100%;border:2px solid var(--red-deep);background:linear-gradient(180deg,#f97b4c,#ef5d32);color:#fff;border-radius:14px;padding:13px 16px;font-size:19px;font-weight:900;letter-spacing:1px;box-shadow:0 4px 0 var(--red-deep)}
  .checkout-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--red-deep)}
  .checkout-btn[aria-disabled="true"]{filter:grayscale(.75);opacity:.6;cursor:not-allowed}

  /* ===== 翻页计算流程 ===== */
  .flow-screen{min-height:calc(100vh - 22px);display:flex;flex-direction:column;align-items:center;padding:16px 0}
  .flow-topbar{width:100%;max-width:860px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .flow-progress{flex:1;min-width:200px;text-align:center;font-size:17px;font-weight:900;color:#6d4d2f}
  .flow-progress .dots{display:flex;gap:6px;justify-content:center;margin-top:6px}
  .flow-progress .dot{width:14px;height:14px;border-radius:50%;background:#e8d5b7;border:2px solid #d7c4a6}
  .flow-progress .dot.done{background:#7ccf9e;border-color:#2f7d53}
  .flow-progress .dot.now{background:var(--yellow);border-color:#d9a520;transform:scale(1.2)}
  .flow-card{width:100%;max-width:860px;background:var(--paper);border:3px solid var(--line);border-radius:24px;padding:22px 22px;box-shadow:0 8px 0 var(--line);transition:transform .25s,opacity .25s}
  .flow-card.leaving{transform:translateX(-40px) rotate(-1deg);opacity:0}
  .flow-card.entering{transform:translateX(40px);opacity:0}
  .flow-card h2{margin:0 0 12px;font-size:25px;font-weight:900;color:#245c3d;text-align:center}
  .flow-card .flow-sub{margin:0 0 14px;font-size:16px;color:var(--ink-soft)}
  .flow-q{margin:0 0 10px;font-size:18px;font-weight:800;color:#4a3322;line-height:1.5}
  .flow-hint{background:#fff9ef;border:1.5px dashed #e2cfb2;border-radius:12px;padding:9px 12px;font-size:15px;font-weight:800;color:#6d4d2f;margin-top:8px}
  .flow-expr{min-height:58px;border:2px dashed #b9d6c4;border-radius:12px;background:#fff;padding:10px 14px;font-size:24px;font-weight:900;color:#245c3d;word-break:break-all;line-height:1.4;font-variant-numeric:tabular-nums;display:flex;align-items:center;min-width:0}
  .flow-expr.empty{color:#9bb3a4;font-size:16px;font-weight:700}
  .flow-expr .num{color:#1f5e8a}
  .flow-expr .op{color:#b4481c}
  .flow-expr .paren{color:#d94f3b}
  .flow-feedback{font-size:16.5px;font-weight:800;margin:12px 0 4px;min-height:24px;text-align:center}
  .flow-feedback.ok{color:#237a4c}
  .flow-feedback.bad{color:#a93424}

  /* 订单摘要（每步固定显示） */
  .order-summary{background:#fff9ef;border:2px solid #f0d59c;border-radius:14px;padding:12px 14px;margin-bottom:14px}
  .order-summary h3{margin:0 0 8px;font-size:17px;color:#9a5a0a}
  .summary-customer{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
  .summary-avatar{flex:none;width:44px;height:44px;border-radius:12px;background:#fff;border:2px solid #f0d59c;display:grid;place-items:center;overflow:hidden}
  .summary-avatar svg{width:100%;height:100%}
  .summary-speech{flex:1;background:#fff;border:2px solid #f0d59c;border-radius:10px;padding:7px 10px;font-size:15px;color:#5f4837;line-height:1.45}
  .summary-speech strong{color:#2f241c;font-weight:900}
  .summary-rows{margin-top:6px}
  .summary-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dotted rgba(190,154,106,.35);font-size:16px}
  .summary-row:last-child{border-bottom:0}
  .summary-food-name{font-size:17px;font-weight:800;color:var(--ink)}
  .summary-qty-price{font-size:20px;font-weight:900;color:#b4481c;font-variant-numeric:tabular-nums;white-space:nowrap}
  .summary-row b{font-variant-numeric:tabular-nums}
  .summary-paid{color:#b4481c;font-size:17px;font-weight:800;padding-top:6px}
  .summary-paid b{font-size:20px;font-weight:900}
  .summary-expr{margin-top:8px;padding-top:8px;border-top:2px dashed #e2cfb2;font-size:16px;font-weight:900;color:#245c3d;word-break:break-all}
  .summary-expr small{display:block;font-size:13px;font-weight:800;color:#8a7059}

  /* 答案框（第四页） */
  .answer-input{width:100%;min-height:58px;border:2px dashed #b9d6c4;border-radius:12px;background:#fff;padding:10px 12px;font-size:26px;font-weight:900;color:#245c3d;text-align:center;font-variant-numeric:tabular-nums}
  .answer-input:focus{outline:3px solid #b9d6c4;border-color:#2f7d53}

  /* 精简算式构建面板（无0-9计算器，只显示本题数字与运算符） */
  .builder-box{margin-top:10px;background:#f7fbf8;border:1.5px solid #cfe3d6;border-radius:14px;padding:12px 14px}
  .builder-group + .builder-group{margin-top:10px;padding-top:10px;border-top:1px dashed #d5e6dc}
  .builder-label{display:block;font-size:13.5px;font-weight:800;color:#527a63;margin-bottom:7px}
  .builder-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .num-chip{min-width:52px;height:46px;border:2px solid #9cc2df;background:#fff;color:#1f5e8a;border-radius:14px;padding:0 14px;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 #c5dff2;transition:transform .1s,background .1s}
  .num-chip:hover{background:#eaf4fc;transform:translateY(-1px)}
  .num-chip:active{transform:translateY(2px);box-shadow:none}
  .num-chip:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .op-chip{min-width:46px;height:46px;border:2px solid #e8c9a8;background:#fff4e6;color:#b4481c;border-radius:12px;padding:0 12px;font-size:21px;font-weight:900;box-shadow:0 3px 0 #e8c9a8;transition:transform .1s,background .1s}
  .op-chip.paren{border-color:#e9b3aa;background:#fff3f0;color:#c93d2b;box-shadow:0 3px 0 #e9b3aa}
  .op-chip.util{border-color:#d7c4a6;background:#f4ecdf;color:#6d4d2f;font-size:14.5px;padding:0 14px;box-shadow:0 3px 0 #d7c4a6}
  .op-chip:hover{filter:brightness(.97);transform:translateY(-1px)}
  .op-chip:active{transform:translateY(2px);box-shadow:none}
  .op-chip:disabled{opacity:.45;cursor:not-allowed;transform:none}

  .flow-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .flow-check-btn{border:2px solid #2f7d53;background:linear-gradient(180deg,#3f9c6c,#2f7d53);color:#fff;border-radius:13px;padding:12px 26px;font-size:18px;font-weight:900;box-shadow:0 3px 0 #1f5c3d}
  .flow-check-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #1f5c3d}
  .flow-check-btn:disabled{opacity:.55;cursor:not-allowed}
  .flow-next-btn{border:2px solid var(--red-deep);background:linear-gradient(180deg,#f97b4c,#ef5d32);color:#fff;border-radius:13px;padding:12px 28px;font-size:19px;font-weight:900;box-shadow:0 4px 0 var(--red-deep);animation:nextPop .22s ease-out}
  .flow-next-btn:hover{background:linear-gradient(180deg,#fa8459,#f26a41)}
  .flow-next-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red-deep)}
  @keyframes nextPop{from{transform:scale(.94);opacity:.7}to{transform:scale(1);opacity:1}}

  .hint-wrap{margin:10px 0 8px}
  .hint-btn{border:1.5px dashed #b9d6c4;background:#fff;color:#527a63;border-radius:10px;padding:7px 14px;font-size:14px;font-weight:800}
  .hint-btn:hover{background:#f3faf5}

  /* 选择题（第三页） */
  .mc-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .mc-btn{text-align:left;border:2px solid #d7c4a6;background:#fffaf0;border-radius:14px;padding:12px 14px;font-size:18px;font-weight:800;color:#4a3322;box-shadow:0 2px 0 #d7c4a6;line-height:1.45}
  .mc-btn:hover{background:#fff1d6}
  .mc-btn.correct{border-color:#7ccf9e;background:#eef8f1;color:#1f6b46}
  .mc-btn.wrong{border-color:#e9a296;background:#fff3f0;color:#a93424}

  .flow-receipt{background:#fffaf0;border:2px dashed #d9b98c;border-radius:14px;padding:12px 13px;font-size:16px;margin-top:12px}
  .receipt-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:6px 0;border-bottom:1px dotted rgba(190,154,106,.3)}
  .receipt-row:last-child{border-bottom:0}
  .receipt-row span{min-width:0;padding-right:6px}
  .receipt-row small{display:block;font-size:13px;color:#a08467;margin-top:2px}
  .receipt-row b{white-space:nowrap;font-variant-numeric:tabular-nums}
  .receipt-row.total{border-top:2px dashed #c99f65;margin-top:4px;padding-top:9px;font-size:20px;font-weight:900;color:#b4481c}

  /* ===== 营业结算 ===== */
  .report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
  .report-card{background:#fff9ef;border:2px solid #f0e1cc;border-radius:14px;padding:12px;text-align:center}
  .report-card .label{display:block;font-size:13px;font-weight:800;color:var(--ink-soft)}
  .report-card .value{display:block;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}

  /* ===== 数据/成就/账号/排行榜页面 ===== */
  .data-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0}
  .data-card{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:14px}
  .data-card .label{display:block;font-size:13px;font-weight:800;color:var(--ink-soft)}
  .data-card .value{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
  .avatar-row{display:flex;gap:8px;flex-wrap:wrap}
  .avatar-opt{width:52px;height:52px;border-radius:14px;border:3px solid var(--line);background:#fff;display:grid;place-items:center;font-size:28px;line-height:1;overflow:hidden;padding:0}
  .avatar-opt.sel{border-color:var(--green);background:#eef8f1}
  .guest-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;background:#fffdf8;border:2px solid var(--line);border-radius:14px;padding:6px 12px}
  .guest-bar label{font-size:14px;font-weight:800;color:#6d4d2f}
  .guest-bar input{height:34px;border:1.5px solid #e2cfb2;border-radius:9px;padding:0 10px;font-size:15px;font-weight:800;color:var(--ink);background:#fffaf0;width:170px}
  .guest-bar input:focus{outline:2px solid #b9d6c4;border-color:#2f7d53}
  .lb-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .lb-tab{border:2px solid var(--line);background:#fffaf0;color:#6d4d2f;border-radius:12px;padding:8px 14px;font-size:15px;font-weight:900}
  .lb-tab.active{background:var(--ink);color:#fff7ec;border-color:var(--ink)}
  .lb-row-me td{background:#eef8f1 !important;font-weight:900;color:#1f6b46}
  .me-pill{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:#2f7d53;color:#fff;font-size:11.5px;font-weight:900}
  .rules-card-box{background:#fff9ef;border:2px solid #f0d59c;border-radius:16px;padding:14px 16px;text-align:center}
  .rules-card-box .rc-focus{font-size:17px;font-weight:900;color:#245c3d;margin-bottom:6px}
  .rules-card-box .rc-time{font-size:15px;font-weight:800;color:#9a5a0a}
  .ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:14px 0}
  .ach-card{border:3px solid var(--line);border-radius:16px;padding:14px;text-align:center;background:var(--paper);display:flex;flex-direction:column;gap:6px;align-items:center}
  .ach-card.unlocked{border-color:#7ccf9e;background:#f5fcf8}
  .ach-card.locked{opacity:.55}
  .ach-icon{font-size:38px;line-height:1}
  .ach-name{font-weight:900;font-size:16px}
  .ach-desc{font-size:13px;color:var(--ink-soft);line-height:1.4}
  .ach-date{font-size:12px;color:#237a4c;font-weight:800}
  .ach-progress{width:100%;height:10px;background:#f0e3ce;border-radius:999px;overflow:hidden}
  .ach-progress i{display:block;height:100%;background:linear-gradient(90deg,#2f9e63,#7ccf9e)}

  .table-wrap{overflow-x:auto}
  table.data-table{width:100%;border-collapse:collapse;font-size:15px;min-width:560px}
  .data-table th,.data-table td{border:1px solid #e8d5b7;padding:8px 10px;text-align:center}
  .data-table th{background:#fff3d9;font-weight:900;color:#6d4d2f}
  .data-table tr:nth-child(even) td{background:#fffdf8}
  .mistake-list{display:flex;flex-direction:column;gap:8px;margin:10px 0}
  .mistake-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff9ef;border:1.5px solid #f0e1cc;border-radius:12px;padding:9px 12px}
  .mistake-row .mname{font-weight:800;font-size:15px}
  .mistake-row .mbar{flex:1;height:10px;background:#f0e3ce;border-radius:999px;overflow:hidden;min-width:80px}
  .mistake-row .mbar i{display:block;height:100%;background:linear-gradient(90deg,#e98a3a,#d94f3b)}
  .mistake-row .mcount{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}

  .feedback-box{background:#eef8f1;border:1.5px solid #cbe7d6;border-radius:14px;padding:12px 14px;margin:12px 0}
  .feedback-box h3{margin:0 0 8px;font-size:17px;color:#237a4c}
  .feedback-box li{margin:6px 0;font-size:15px;line-height:1.5}

  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .field label{font-size:15px;font-weight:900;color:#6d4d2f}
  .field input,.field select{height:48px;border:2px solid #e2cfb2;border-radius:12px;padding:0 12px;font-size:17px;background:#fff;color:var(--ink)}
  .field input:focus,.field select:focus{outline:3px solid #b9d6c4;border-color:#2f7d53}
  .warn-note{background:#fff3f0;border:1.5px solid #e9a296;color:#a93424;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:800;line-height:1.5;margin:10px 0}

  /* ===== modal / toast / confetti ===== */
  .overlay{position:fixed;inset:0;z-index:100;background:rgba(47,36,28,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;transition:opacity .18s}
  .overlay.show{opacity:1}
  .modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:#fffdf8;border:3px solid #3c2a1e;border-radius:26px;box-shadow:0 26px 70px rgba(45,28,14,.35);padding:26px 24px 22px;position:relative;transform:translateY(10px) scale(.98);transition:transform .2s}
  .modal.wide{width:min(920px,100%)}
  .overlay.show .modal{transform:none}
  .modal.tone-ok{border-color:#2f7d53}
  .modal.tone-bad{border-color:#b93a28}
  .modal-close{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:1.5px solid #e5d3b9;background:#fff7e9;color:#8b6e52;font-weight:900;font-size:18px;line-height:1}
  .modal-close:hover{background:#ffefd4}
  .modal-head{text-align:center;padding:0 14px}
  .modal-hero{font-size:58px;line-height:1.1;margin-bottom:2px}
  .modal h2{margin:2px 0 6px;font-size:26px;letter-spacing:.5px}
  .modal.tone-ok h2{color:#236b47}.modal.tone-bad h2{color:#a63c2a}
  .modal-sub{margin:0 auto;max-width:520px;font-size:17px;line-height:1.6;color:#6f5b4b}
  .modal-body{margin-top:15px;font-size:16px;line-height:1.65;color:#5f4837}
  .modal-body p{margin:0 0 9px}
  .modal-body h3{margin:14px 0 7px;font-size:18px}
  .modal-body h3:first-child{margin-top:0}
  .modal-actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:19px}
  .btn{border-radius:13px;padding:12px 20px;font-size:17px;font-weight:900;border:2px solid transparent;min-width:120px}
  .btn-primary{border-color:var(--red-deep);background:linear-gradient(180deg,#f97b4c,#ef5d32);color:#fff;box-shadow:0 3px 0 var(--red-deep)}
  .btn-ghost{border-color:#e2cfb2;background:#fffaf1;color:#765b43;box-shadow:0 3px 0 #e2cfb2}
  .btn-green{border-color:#1f5c3d;background:linear-gradient(180deg,#3f9c6c,#2f7d53);color:#fff;box-shadow:0 3px 0 #1f5c3d}
  .btn:active{transform:translateY(2px);box-shadow:none}

  .toast{position:fixed;left:50%;bottom:26px;z-index:150;transform:translate(-50%,16px);background:rgba(47,36,28,.96);color:#fff8ef;padding:11px 19px;border-radius:999px;font-size:16px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:92vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .confetti{position:fixed;inset:0;z-index:120;pointer-events:none;overflow:hidden}
  .confetti-piece{position:absolute;top:-24px;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(112vh) rotate(720deg);opacity:.9}}

  /* 成就弹窗动画 */
  .ach-pop{position:fixed;top:18px;right:18px;z-index:200;background:#fffdf8;border:3px solid #7ccf9e;border-radius:20px;padding:16px 18px;box-shadow:0 18px 50px rgba(0,0,0,.3);display:flex;gap:14px;align-items:center;max-width:340px;animation:achIn .4s cubic-bezier(.2,.9,.3,1.3)}
  .ach-pop .icon{font-size:44px;line-height:1}
  .ach-pop .title{font-size:13px;font-weight:900;color:#237a4c;letter-spacing:1px}
  .ach-pop .name{font-size:19px;font-weight:900}
  .ach-pop .desc{font-size:14px;color:var(--ink-soft)}
  @keyframes achIn{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}
  .ach-pop .close{position:absolute;top:6px;right:8px;border:0;background:none;font-size:18px;color:#8b6e52}

  .tray-fab{display:none}
  @media(max-width:1280px){
    .menu-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  }
  @media(max-width:980px){
    .game-layout{grid-template-columns:1fr}
    .side-panel{position:static;max-height:none;overflow:visible;padding-right:0}
    .menu-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .page{padding-bottom:92px}
    .tray-fab{display:inline-flex;position:fixed;right:max(14px,calc((100vw - min(1460px,97vw))/2));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:95;align-items:center;gap:9px;background:var(--green);color:#fff;border:2px solid #145c38;border-radius:999px;padding:9px 17px 9px 9px;font-weight:900;font-size:16px;line-height:1.2;box-shadow:0 8px 24px rgba(0,0,0,.28)}
    .tray-fab:active{transform:scale(.97)}
    .tray-fab-num{display:grid;place-items:center;min-width:32px;height:32px;padding:0 8px;border-radius:999px;background:#fff;color:var(--green);font-size:15px;font-weight:900}
  }
  @media(max-width:700px){
    body{font-size:17px}
    .page{width:min(1460px,95vw);padding-top:10px}
    .brand h1{font-size:24px}
    .brand-badge{width:52px;height:52px;font-size:28px}
    .level-grid{grid-template-columns:1fr}
    .game-topbar{gap:8px;padding:8px 10px}
    .game-topbar .brand{display:none}
    .game-topbar .top-actions{margin-left:0;width:100%;justify-content:flex-end}
    .menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .biz-bar{grid-template-columns:repeat(3,minmax(0,1fr))}
    .modal{padding:22px 16px 18px;border-radius:22px}
    .modal h2{font-size:22px}
    .btn{padding:11px 14px;min-width:104px;font-size:16px}
    .customer-box{flex-direction:column;align-items:flex-start}
    .customer-avatar{width:50px;height:50px}
    .flow-card{padding:18px 14px}
    .flow-card h2{font-size:21px}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
    .flow-card.leaving{transform:none;opacity:1}
    .flow-card.entering{transform:none;opacity:1}
  }
</style>
</head>

function getLeaderboard(levelId){
  const rows = [];
  const accs = loadAccounts();
  Object.values(accs).forEach(p => {
    const lv = p.levels && p.levels[levelId];
    if(lv && (lv.sessions > 0 || lv.bestRevenue > 0)){
      const accPct = lv.totalQuestions > 0 ? Math.round(lv.correctQuestions / lv.totalQuestions * 100) : 0;
      rows.push({
        id: p.id,
        name: p.name,
        avatar: p.avatar || '🧑',
        revenue: lv.bestRevenue || 0,
        accuracy: accPct,
        orders: lv.bestOrders || 0,
        role: 'reg',
        isMe: state.account === p.id
      });
    }
  });
  const gScores = loadGuestScores().filter(g => g.level === levelId);
  const myGuest = displayGuestName();
  gScores.forEach((g, idx) => {
    rows.push({
      id: 'guest_' + idx,
      name: g.name || t(STR.guestDefaultName),
      avatar: '👤',
      revenue: g.revenue || 0,
      accuracy: g.accuracy || 0,
      orders: g.orders || 0,
      role: 'guest',
      isMe: !state.account && (g.name === myGuest)
    });
  });
  (PEER_SCORES[levelId] || []).forEach((p, idx) => {
    rows.push({
      id: 'peer_' + idx,
      name: p.name,
      avatar: p.avatar,
      revenue: p.revenue,
      accuracy: p.accuracy,
      orders: p.orders,
      role: 'peer',
      isMe: false
    });
  });
  rows.sort((a, b) => (b.revenue - a.revenue) || (b.accuracy - a.accuracy) || (b.orders - a.orders));
  return rows;
}

/* ========================= 数学：表达式解析 ========================= */
function normalizeExpr(str){
  return String(str == null ? '' : str)
    .replace(/×/g,'*').replace(/÷/g,'/')
    .replace(/[−–—－]/g,'-')
    .replace(/[，,\s]/g,'');
}
function evalExpr(str){
  const s = normalizeExpr(str);
  if(!s) return null;
  let i = 0;
  function parseExpr(){ let v = parseTerm(); if(v===null) return null; while(i<s.length && (s[i]==='+'||s[i]==='-')){ const op=s[i++]; const r=parseTerm(); if(r===null) return null; v = op==='+'?v+r:v-r; } return v; }
  function parseTerm(){ let v=parseFactor(); if(v===null) return null; while(i<s.length && (s[i]==='*'||s[i]==='/')){ const op=s[i++]; const r=parseFactor(); if(r===null) return null; if(op==='/'){ if(r===0) return null; v=v/r; } else v=v*r; } return v; }
  function parseFactor(){ if(i>=s.length) return null; if(s[i]==='('){ i++; const v=parseExpr(); if(v===null||s[i]!==')') return null; i++; return v; } if(s[i]==='-'){ i++; const v=parseFactor(); return v===null?null:-v; } if(s[i]==='+'){ i++; return parseFactor(); } const m=/^\d+/.exec(s.slice(i)); if(!m) return null; i+=m[0].length; return Number(m[0]); }
  const v = parseExpr();
  if(v===null || i!==s.length) return null;
  return Number.isFinite(v)?v:null;
}
function parseExprAST(str){
  const s = normalizeExpr(str);
  if(!s) return null;
  let i = 0;
  function parseExpr(){ let node=parseTerm(); if(!node) return null; while(i<s.length && (s[i]==='+'||s[i]==='-')){ const op=s[i++]; const right=parseTerm(); if(!right) return null; node={type:'bin',op:op,left:node,right:right}; } return node; }
  function parseTerm(){ let node=parseFactor(); if(!node) return null; while(i<s.length && (s[i]==='*'||s[i]==='/')){ const op=s[i++]; const right=parseFactor(); if(!right) return null; node={type:'bin',op:op,left:node,right:right}; } return node; }
  function parseFactor(){ if(i>=s.length) return null; if(s[i]==='('){ i++; const inner=parseExpr(); if(!inner||s[i]!==')') return null; i++; return {type:'paren',expr:inner}; } if(s[i]==='-'||s[i]==='+'){ const op=s[i++]; const inner=parseFactor(); if(!inner) return null; return {type:'unary',op:op,expr:inner}; } const m=/^\d+/.exec(s.slice(i)); if(!m) return null; i+=m[0].length; return {type:'num',value:Number(m[0])}; }
  const ast = parseExpr();
  if(!ast || i!==s.length) return null;
  return ast;
}
function evalAST(n){
  if(!n) return null;
  if(n.type==='num') return n.value;
  if(n.type==='paren') return evalAST(n.expr);
  if(n.type==='unary'){ const v=evalAST(n.expr); return v===null?null:(n.op==='-'?-v:v); }
  if(n.type==='bin'){ const a=evalAST(n.left), b=evalAST(n.right); if(a===null||b===null) return null; if(n.op==='+') return a+b; if(n.op==='-') return a-b; if(n.op==='*') return a*b; if(n.op==='/') return b===0?null:a/b; }
  return null;
}
function astNumbers(n, out){
  out = out || [];
  if(!n) return out;
  if(n.type==='num') out.push(n.value);
  else if(n.type==='paren') astNumbers(n.expr,out);
  else if(n.type==='unary') astNumbers(n.expr,out);
  else if(n.type==='bin'){ astNumbers(n.left,out); astNumbers(n.right,out); }
  return out;
}
function astHasOp(n, op){
  if(!n) return false;
  if(n.type==='bin' && n.op===op) return true;
  if(n.type==='paren'||n.type==='unary') return astHasOp(n.expr,op);
  if(n.type==='bin') return astHasOp(n.left,op)||astHasOp(n.right,op);
  return false;
}
function astCountOp(n, op){
  if(!n) return 0;
  if(n.type==='paren'||n.type==='unary') return astCountOp(n.expr,op);
  if(n.type==='bin') return (n.op===op?1:0) + astCountOp(n.left,op) + astCountOp(n.right,op);
  return 0;
}
function astHasDiv(n){ return astHasOp(n,'/'); }
function sameMultiset(a,b){
  if(a.length!==b.length) return false;
  const x=a.slice().sort((p,q)=>p-q), y=b.slice().sort((p,q)=>p-q);
  for(let j=0;j<x.length;j++){ if(x[j]!==y[j]) return false; }
  return true;
}
function isMulMode(levelId){
  const lv = levelId || state.level;
  return lv === 'advanced' || lv === 'challenge';
}
function groupPrices(ent){
  const map = new Map();
  ent.forEach(e => {
    const p = e.food.price;
    if(!map.has(p)) map.set(p, { price:p, totalQty:0, itemCount:0 });
    const g = map.get(p);
    g.totalQty += e.qty;
    g.itemCount += 1;
  });
  return Array.from(map.values());
}
function expectedSpendNumbers(ent, levelId){
  const out=[];
  if(isMulMode(levelId)){
    groupPrices(ent).forEach(g => {
      out.push(g.price);
      if(g.totalQty >= 2) out.push(g.totalQty);
    });
    return out;
  }
  ent.forEach(e => { out.push(e.food.price); if(e.qty>1) out.push(e.qty); });
  return out;
}

/* ========================= 游戏数据模型 ========================= */
function entries(){
  return Object.keys(state.cart).filter(id => state.cart[id]>0 && FOOD_BY_ID[id]).map(id => ({ food:FOOD_BY_ID[id], qty:state.cart[id] }));
}
function spendOf(ent){ return ent.reduce((s,e)=>s+e.qty*e.food.price,0); }
function ecoOf(ent){ return ent.reduce((s,e)=>s+e.qty*e.food.eco,0); }
function foodHealth(f){ return (f.tags||[]).reduce((s,tag)=>s+(TAG_HEALTH[tag]||0),0); }
function healthOf(ent){ return ent.reduce((s,e)=>s+e.qty*foodHealth(e.food),0); }
function portionsOf(ent){ return ent.reduce((s,e)=>s+e.qty,0); }
function numbersOf(ent, levelId){
  if(!ent.length) return 0;
  if(isMulMode(levelId)){
    return 1 + groupPrices(ent).reduce((s,g)=>s+(g.totalQty>=2?2:1),0);
  }
  return 1 + ent.reduce((s,e)=>s+(e.qty>1?2:1),0);
}
function hasMulOf(ent, levelId){
  if(isMulMode(levelId)) return groupPrices(ent).some(g => g.totalQty >= 2);
  return ent.some(e=>e.qty>1);
}
function hasSamePriceMul(ent, levelId){
  return isMulMode(levelId) && groupPrices(ent).some(g => g.totalQty >= 2 && g.itemCount > 1);
}

function canAdd(id){
  const f = FOOD_BY_ID[id], L = LEVELS[state.level];
  if(!f || !L) return { ok:false, msg:tf(STR.toastMaxTypes,{n:2}) };
  const cur = state.cart[id] || 0;
  if(cur >= L.maxQty) return { ok:false, msg:tf(STR.toastMaxQty,{n:L.maxQty}) };
  const ent = entries();
  if(cur===0 && ent.length >= L.maxTypes) return { ok:false, msg:tf(STR.toastMaxTypes,{n:L.maxTypes}) };
  const proj = Object.assign({}, state.cart);
  proj[id] = (proj[id]||0)+1;
  const projEnt = Object.keys(proj).filter(k=>proj[k]>0).map(k=>({food:FOOD_BY_ID[k], qty:proj[k]}));
  if(numbersOf(projEnt) > L.maxNumbers) return { ok:false, msg:tf(STR.toastMaxNumbers,{n:L.maxNumbers}) };
  return { ok:true };
}

function genOrder(levelId){
  const all = FOODS.slice();
  const pick = (arr, n) => { const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a.slice(0,n); };

  if(levelId === 'basic'){
    const chosen = pick(all, 2);
    const request = { items: chosen.map(f => ({ id:f.id, qty:1 })), totalQty:2 };
    return { type: randomCustomerType(), request, paid: customerPaidFor(request.items.map(x=>({food:FOOD_BY_ID[x.id],qty:x.qty}))) };
  }
  if(levelId === 'advanced'){
    const chosen = pick(all, 2);
    const mulIdx = Math.random() < 0.5 ? 0 : 1;
    const qty = 2 + Math.floor(Math.random()*2);

    return { type: randomCustomerType(), request, paid: customerPaidFor(request.items.map(x=>({food:FOOD_BY_ID[x.id],qty:x.qty}))) };
  }
  // challenge（環保模式）：顧客要求店長推薦三個食物（可重複），並符合高環保包裝條件
  const templates = [
    { cats:{ filling:2, drink:1 }, dineIn:false, paid:40 },
    { cats:{ filling:1, snack:1, drink:1 }, dineIn:true, paid:50 },
    { cats:{ filling:2, snack:1 }, dineIn:true, paid:50 },
    { cats:{ filling:1, drink:2 }, dineIn:false, paid:40 },
    { cats:{ snack:2, drink:1 }, dineIn:false, paid:40 }
  ];
  const tpl = templates[Math.floor(Math.random()*templates.length)];
  return {
    type: randomCustomerType(),
    request: {
      isRecommend: true,
      cats: Object.assign({}, tpl.cats),
      totalQty: 3,
      dineIn: tpl.dineIn,
      budget: tpl.paid
    },
    paid: tpl.paid
  };
}

/* 檢查餐盤食物是否符合顧客要求的類別配搭 */
function matchCategories(ent, reqCats){
  const foods = [];
  ent.forEach(e => { for(let i=0;i<e.qty;i++) foods.push(e.food); });
  const slots = [];
  Object.keys(reqCats).forEach(cat => { for(let i=0;i<(reqCats[cat]||0);i++) slots.push(cat); });
  if(foods.length !== slots.length) return false;
  const perms = [[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
  return perms.some(p => p.every((fi, si) => foods[fi] && foods[fi].tags.includes(slots[si])));
}

/* 計算完成後自動判斷是否符合顧客的環保包裝要求 */
function evaluateChallengeEco(ent, req){
  const items = [];
  ent.forEach(e => { for(let i=0;i<e.qty;i++) items.push(e.food); });
  const badItems = [];
  if(req.dineIn){
    items.forEach(f => {
      if(f.packIcon !== '🍽️' || f.eco < 3){
        if(badItems.indexOf(t(f.name)) === -1) badItems.push(t(f.name));
      }
    });
    return { ok: badItems.length === 0, badItems };
  } else {
    items.forEach(f => {
      if(f.eco <= 1){
        if(badItems.indexOf(t(f.name)) === -1) badItems.push(t(f.name));
      }
    });
    const hasZero = items.some(f => f.eco === 0);
    const totalEco = items.reduce((s,f) => s + f.eco, 0);
    const ok = !hasZero && totalEco >= 7;
    return { ok, badItems };
  }
}

/* ========================= 结账前检查 ========================= */
function preCheckoutCheck(){
  const c = state.customer, L = LEVELS[state.level];
  const ent = entries();
  if(state.level === 'challenge' && c.request.isRecommend){
    const tot = portionsOf(ent);
    if(tot !== 3){
      return { ok:false, msg: tf(STR.chkNeedRec3, {n:tot}) };
    }
    if(!matchCategories(ent, c.request.cats)){
      return { ok:false, msg: t(STR.chkWrongCat) };
    }
    if(spendOf(ent) >= c.paid){
      return { ok:false, msg: tf(STR.chkOverPaid, {n:c.paid}) };
    }
    return { ok:true };
  }
  for(const item of c.request.items){
    const got = state.cart[item.id] || 0;
    if(got !== item.qty){
      const f = FOOD_BY_ID[item.id];
      return { ok:false, msg: tf(STR.chkNeedQty, {n:item.qty, name:t(f.name)}) };
    }
  }
  if(ent.length < L.minTypes){
    return { ok:false, msg: t(STR.chkMissingType) };
  }
  if(c.request.totalQty && portionsOf(ent) < c.request.totalQty){
    return { ok:false, msg: tf(STR.chkNeedTotal, {n:c.request.totalQty}) };
  }
  if(state.level==='advanced' && !hasMulOf(ent)){
    return { ok:false, msg: t(STR.chkNeedMul) };
  }
  return { ok:true };
}

function exprPrettyHTML(str){
  if(!str) return '';
  let out='', i=0;
  while(i<str.length){
    const c=str[i];
    if(/\d/.test(c)){ let j=i; while(j<str.length && /\d/.test(str[j])) j++; out+='<span class="num">'+esc(str.slice(i,j))+'</span>'; i=j; }
    else if('+−-×÷*'.indexOf(c)!==-1){ out+='<span class="op">'+c+'</span>'; i++; }
    else if(c==='('||c===')'){ out+='<span class="paren">'+c+'</span>'; i++; }
    else i++;
  }
  return out;
}

function flowStep3Question(){

  }

function flowStep3Options(){
  const ent = entries();
  const sp = spendOf(ent);
  const c = state.customer;
  const groups = groupPrices(ent);
  const innerStr = isMulMode()
    ? groups.map(g => g.totalQty>=2 ? (g.price+' × '+g.totalQty) : (''+g.price)).join(' + ')
    : ent.map(e => e.qty>1 ? (e.qty+' × '+e.food.price) : (''+e.food.price)).join(' + ');

  if(state.flow.mcOptions && state.flow.mcOptions.length === 3){
    return renderMCOptions(state.flow.mcOptions);
  }

  if(state.level === 'basic'){
    const a = ent[0], b = ent[1];
    const pa = a.food.price, pb = b.food.price;
    const optA = c.paid+' − '+pa;
    const optB = pa+' + '+pb;
    const optC = c.paid+' − '+pb;
    const opts = [ {label:'A. '+optB, correct:true}, {label:'B. '+optA, correct:false}, {label:'C. '+optC, correct:false} ];
    const idx = shuffleIndex();
    const ordered = idx.map((origIdx, pos) => ({ label: ['A. ','B. ','C. '][pos] + opts[origIdx].label.slice(3), correct: opts[origIdx].correct }));
    state.flow.mcOptions = ordered;
    state.flow._mcCorrectIndex = ordered.findIndex(o=>o.correct);
    return renderMCOptions(ordered);
  }
  if(state.level === 'advanced'){
    const mulGrp = groups.find(g => g.totalQty >= 2);
    const mulStr = mulGrp ? (mulGrp.price+' × '+mulGrp.totalQty) : (ent[0].qty+' × '+ent[0].food.price);
    const otherGrp = mulGrp ? groups.find(g => g !== mulGrp) : groups[1];
    const otherStr = (mulGrp && otherGrp) ? (otherGrp.price+' + '+mulGrp.price) : (c.paid+' − '+ent[0].food.price);
    const optSub = c.paid+' − '+sp;
    const opts = [ {label:'A. '+mulStr, correct:true}, {label:'B. '+otherStr, correct:false}, {label:'C. '+optSub, correct:false} ];
    const idx = shuffleIndex();
    const ordered = idx.map((origIdx, pos) => ({ label: ['A. ','B. ','C. '][pos] + opts[origIdx].label.slice(3), correct: opts[origIdx].correct }));
    state.flow.mcOptions = ordered;
    state.flow._mcCorrectIndex = ordered.findIndex(o=>o.correct);
    return renderMCOptions(ordered);
  }
  const mulGrp = groups.find(g => g.totalQty >= 2);
  let opt1, opt2, opt3;
  if(mulGrp){
    const otherGrp = groups.find(g => g !== mulGrp);
    opt1 = mulGrp.price+' × '+mulGrp.totalQty;
    opt2 = otherGrp ? (otherGrp.price+' + '+mulGrp.price) : innerStr;
    opt3 = c.paid+' − '+(otherGrp ? otherGrp.price : mulGrp.price);
  } else {
    opt1 = innerStr;
    opt2 = c.paid+' − '+sp;
    opt3 = c.paid+' − '+ent[0].food.price;
  }
  const opts = [ {label:'A. '+opt1, correct:true}, {label:'B. '+opt2, correct:false}, {label:'C. '+opt3, correct:false} ];
  const idx = shuffleIndex();
  const ordered = idx.map((origIdx, pos) => ({ label: ['A. ','B. ','C. '][pos] + opts[origIdx].label.slice(3), correct: opts[origIdx].correct }));
  state.flow.mcOptions = ordered;
  state.flow._mcCorrectIndex = ordered.findIndex(o=>o.correct);
  return renderMCOptions(ordered);
}
function shuffleIndex(){
  const a = [0,1,2];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function renderMCOptions(opts){
  const f = state.flow;
  return opts.map((o,i) => {
    let cls = 'mc-btn';
    if(f.mcAnswered){
      if(o.correct) cls += ' correct';
      else if(i === f.mcChosen) cls += ' wrong';
    }
    return '<button type="button" class="'+cls+'" data-mc="'+i+'"'+(f.mcAnswered?' disabled':'')+'>'+esc(o.label)+'</button>';
  }).join('');
}

/* 核验算式（第一步、第二步）— 答对后不自动跳转，等待点击「下一步」 */
function checkFlowExpression(){
  const f = state.flow;
  if(f.status === 'ok') return;
  const ent = entries();
  const c = state.customer;
  const sp = spendOf(ent);
  const s = f.expr || '';
  const ast = parseExprAST(s);
  const val = ast ? evalAST(ast) : null;
  let ok=false, msg='';

  function recordWrong(pattern){
    state.shiftMistakeStep[f.step] = (state.shiftMistakeStep[f.step]||0)+1;
    if(pattern){
      state.shiftMistakeOp[pattern] = (state.shiftMistakeOp[pattern]||0)+1;
      const prof = currentProfile();
      if(prof){
        prof.mistakes[pattern] = (prof.mistakes[pattern]||0)+1;
        saveProfile(prof);
      }
    }
    profileUpdateMistake(f.step);
  }

  if(!s){ msg = t(STR.exprEmpty); }
  else if(!ast || val===null){ msg = t(STR.exprInvalid); }
  else if(f.step===1){
    const mulGroups = isMulMode() ? groupPrices(ent).filter(g => g.totalQty >= 2) : [];
    const samePriceGrp = mulGroups.find(g => g.itemCount > 1);
    const needMul = hasMulOf(ent);
    const notEnoughMul = needMul && (!astHasOp(ast,'*') || (isMulMode() && astCountOp(ast,'*') < mulGroups.length));
    if(notEnoughMul) msg = samePriceGrp ? tf(STR.exprSamePriceMul, {price:samePriceGrp.price, qty:samePriceGrp.totalQty}) : t(STR.exprNeedMul);
    else if(astHasDiv(ast)) msg = t(STR.exprNoDiv);
    else if(astHasOp(ast,'-')) msg = t(STR.exprShouldAdd);
    else if(!sameMultiset(astNumbers(ast), expectedSpendNumbers(ent))) msg = t(STR.exprUseFoodNumbers);
    else if(Math.abs(val-sp)>1e-9) msg = t(STR.exprAWrong);
    else { ok=true; msg=t(STR.flowCorrectDetail1); f.orderAnswers[1] = s; }
  }
  else if(f.step===2){
    const mulGroups = isMulMode() ? groupPrices(ent).filter(g => g.totalQty >= 2) : [];
    const samePriceGrp = mulGroups.find(g => g.itemCount > 1);
    const needMul = hasMulOf(ent);
    if(astHasDiv(ast)) msg = t(STR.exprNoDiv);
    else if(Math.abs(val-(sp-c.paid))<1e-9) msg = t(STR.exprReversed);
    else if(Math.abs(val-(c.paid+sp))<1e-9) msg = t(STR.exprShouldAddCost);
    else if(!ast || ast.type!=='bin' || ast.op!=='-') msg = t(STR.exprShouldSub);
    else if(Math.abs(evalAST(ast.left)-c.paid)>1e-9) msg = t(STR.exprPaidFirst);
    else if(ast.right && ast.right.type!=='paren' && Math.abs(evalAST(ast.right)-sp)<1e-9) msg = t(STR.exprReplaceTotal);
    else if(!ast.right || ast.right.type!=='paren') msg = t(STR.exprNeedParen);
    else if(needMul && (!astHasOp(ast.right,'*') || (isMulMode() && astCountOp(ast.right,'*') < mulGroups.length))) msg = samePriceGrp ? tf(STR.exprSamePriceMul, {price:samePriceGrp.price, qty:samePriceGrp.totalQty}) : t(STR.exprNeedMul);
    else if(!sameMultiset(astNumbers(ast.right), expectedSpendNumbers(ent))) msg = t(STR.exprReplaceTotal);
    else if(Math.abs(evalAST(ast.right)-sp)>1e-9) msg = t(STR.exprCWrong);
    else { ok=true; msg=t(STR.flowCorrectDetail2); f.orderAnswers[2] = s; }
  }

  if(ok){
    f.status = 'ok';
    f.msg = msg;
    state.shiftQuestions++;
    state.shiftCorrect++;
  } else {
    f.status = 'bad';
    f.msg = msg;
    state.shiftQuestions++;
    let pattern = null;
    const mulGroups = isMulMode() ? groupPrices(ent).filter(g => g.totalQty >= 2) : [];
    const samePriceGrp = mulGroups.find(g => g.itemCount > 1);
    const samePriceMsg = samePriceGrp ? tf(STR.exprSamePriceMul, {price:samePriceGrp.price, qty:samePriceGrp.totalQty}) : '';
    if(f.step===2){
      if(msg === t(STR.exprReplaceTotal)) pattern = 'replacedExpressionWithTotal';
      else if(msg === t(STR.exprReversed)) pattern = 'reversedSubtraction';
      else if(msg === t(STR.exprNeedParen)) pattern = 'missingParentheses';
      else if(msg === t(STR.exprNeedMul) || (samePriceMsg && msg === samePriceMsg)) pattern = 'missingMultiplication';
    } else if(f.step===1){
      if(msg === t(STR.exprNeedMul) || (samePriceMsg && msg === samePriceMsg)) pattern = 'missingMultiplication';
      else if(msg === t(STR.exprUseFoodNumbers)) pattern = 'missingFood';
    }
    recordWrong(pattern);
  }
  renderFlowStepCard();
}

/* 核验第四步：只填最终答案 — 答对后不自动跳转，等待点击「下一步」 */
function checkFlowAnswer(){
  const f = state.flow;
  if(f.status === 'ok') return;
  const c = state.customer;
  const ent = entries();
  const sp = spendOf(ent);
  const change = c.paid - sp;
  const ans = (f.answer||'').trim();
  const num = parseFloat(ans);
  const ok = ans !== '' && !isNaN(num) && Math.abs(num - change) < 1e-9;

  if(ok){
    f.status = 'ok';
    f.msg = t(STR.flowCorrectDetail4);
    state.shiftQuestions++;
    state.shiftCorrect++;
    f.orderAnswers[4] = String(change);
    renderFlowStepCard();
  } else {
    f.status = 'bad';
    f.msg = ans === '' ? t(STR.exprEmpty) : t(STR.exprAWrong);
    state.shiftQuestions++;
    state.shiftMistakeStep[4] = (state.shiftMistakeStep[4]||0)+1;
    profileUpdateMistake(4);
    renderFlowStepCard();
    const inp = app.querySelector('[data-answer-input]');
    if(inp){ setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 60); }
  }
}

function answerMC(idx){
  const f = state.flow;
  if(f.mcAnswered) return;
  const correct = idx === f._mcCorrectIndex;
  f.mcChosen = idx;
  f.mcAnswered = true;
  if(correct){
    f.status = 'ok';
    f.msg = t(STR.flowCorrectDetail3);
    state.shiftQuestions++;
    state.shiftCorrect++;
    f.orderAnswers[3] = idx;
  } else {
    f.status = 'bad';
    f.msg = t(STR.exprOrderHint);
    state.shiftQuestions++;
    state.shiftMistakeStep[3] = (state.shiftMistakeStep[3]||0)+1;
    profileUpdateMistake(3);
  }
  renderFlowStepCard();
  if(!correct){
    setTimeout(function(){
      if(state.flow.status !== 'ok'){
        f.mcAnswered=false; f.mcChosen=null; f.status=''; f.msg='';
        renderFlowStepCard();
      }

  }
}

function advanceFlow(){
  const f = state.flow;
  if(f.step < 4){
    f.step++;
    f.expr=''; f.answer=''; f.status=''; f.msg=''; f.hint=false;
    f.mcOptions=[]; f.mcAnswered=false; f.mcChosen=null;
    renderFlowStepCard();
    window.scrollTo({ top:0 });
  } else {
    completeOrder();
  }
}
function completeOrder(){
  const c = state.customer, L = LEVELS[state.level];
  const ent = entries();
  const sp = spendOf(ent), change = c.paid - sp;
  const eco = ecoOf(ent), health = healthOf(ent);
  const timeTaken = Math.round((Date.now()-state.orderStartTime)/1000);

  let ecoEval = { ok: true, badItems: [] };
  if(L.id === 'challenge' && c.request.isRecommend){
    ecoEval = evaluateChallengeEco(ent, c.request);
  }

  if(!ecoEval.ok){
    const badListStr = ecoEval.badItems.length ? ecoEval.badItems.join('、') : bi('部分包裝','some packaging');
    openModal({
      tone:'bad', hero:'🌿', title:t(STR.receiptEcoBad), sub:tf(STR.chkEcoLowButRight, {items: badListStr}),
      actions:'<button class="btn btn-primary" data-back-to-tray>'+t(STR.backBtn)+'</button>'
    });
    profileUpdateMistake('ecoRequirement');
    state.shiftMistakeStep['eco'] = (state.shiftMistakeStep['eco']||0)+1;
    return;
  }

  state.ordersDone++;
  state.revenue += sp;
  state.shiftStreak++;
  const orderAcc = state.shiftQuestions>0 ? Math.round(state.shiftCorrect/state.shiftQuestions*100) : 100;

  const orderRec = {
    no: state.orderNo, items: ent.map(e=>({id:e.food.id, qty:e.qty})),
    cost: sp, paid: c.paid, change: change, expr: state.flow.orderAnswers[2],
    accuracy: orderAcc, time: timeTaken, revenue: sp,
    eco: eco, health: health, ecoMet: ecoEval.ok,
    zeroPlastic: ent.every(e => e.food.eco >= 3)
  };
  state.shiftOrders.push(orderRec);
  state.orderNo++;

  if(state.account) profileUpdateOrder(orderRec);

  showReceipt(orderRec);
}

function unlockAchievement(id){
  const prof = currentProfile();
  if(!prof) return;
  ensureAchievements(prof);
  if(prof.achievements[id] && prof.achievements[id].unlocked) return;
  prof.achievements[id] = { unlocked:true, unlockedAt:new Date().toISOString(), progress:0 };

function checkAchievements(ctx){
  if(!state.account) return;
  const prof = currentProfile();
  if(!prof) return;
  ensureAchievements(prof);
  const t0 = prof.totals;

  // 碳水炸弹：同一订单 叉烧包 + 油条
  if(ctx.order && ctx.order.items){
    const ids = ctx.order.items.map(it=>it.id);
    if(ids.includes('bbqbun') && ids.includes('youtiao')) unlockAchievement('carbBomb');
  }
  if(t0.completedOrders >= 1) unlockAchievement('firstOrder');
  if(t0.sessions >= 1) unlockAchievement('firstShift');
  if(t0.sessions >= 10 && t0.totalQuestions > 0 && (t0.correctQuestions/t0.totalQuestions) >= 0.9) unlockAchievement('excellent');
  if(prof.counters.changeCorrect >= 50) unlockAchievement('cashierPro');
  if(t0.revenue >= 10000) unlockAchievement('tenK');
  if(prof.counters.zeroPlastic >= 10) unlockAchievement('zeroPlastic');
  const lv = prof.levels;
  if(lv.basic.sessions>=10 && lv.advanced.sessions>=10 && lv.challenge.sessions>=10) unlockAchievement('star');
}

/* ========================= 账号数据更新 ========================= */
function profileUpdateMistake(stepKey){
  const prof = currentProfile();
  if(!prof) return;
  const map = { 1:'expenseExpression', 2:'changeExpression', 3:'operationOrder', 4:'finalAnswer', 'eco':'ecoRequirement', 'foodSelection':'foodSelection' };
  const key = map[stepKey] || 'operationOrder';
  prof.mistakes[key] = (prof.mistakes[key]||0)+1;
  saveProfile(prof);
}
function profileUpdateOrder(rec){
  const prof = currentProfile();
  if(!prof) return;
  ensureAchievements(prof);
  const t0 = prof.totals;
  const lv = prof.levels[state.level];

  t0.completedOrders++;
  t0.revenue += rec.revenue;
  t0.totalQuestions += state.shiftQuestions;
  t0.correctQuestions += state.shiftCorrect;
  if(state.shiftStreak > t0.bestStreak) t0.bestStreak = state.shiftStreak;

  lv.completedOrders++;
  lv.revenue += rec.revenue;
  lv.totalQuestions += state.shiftQuestions;
  lv.correctQuestions += state.shiftCorrect;
  lv.totalTime += rec.time;

  if(rec.change >= 0){
    prof.counters.changeCorrect = (prof.counters.changeCorrect||0)+1;
    if(prof.counters.changeCorrect >= 50) unlockAchievement('cashierPro');
  }
  if(rec.zeroPlastic){
    prof.counters.zeroPlastic = (prof.counters.zeroPlastic||0)+1;
  }
  if(state.level==='challenge'){
    lv.totalEco = (lv.totalEco||0) + rec.eco;
    if(rec.ecoMet) lv.ecoOrders = (lv.ecoOrders||0)+1;
    if(rec.zeroPlastic) lv.zeroPlasticOrders = (lv.zeroPlasticOrders||0)+1;
  }
  saveProfile(prof);
  checkAchievements({ order:rec });
}
function profileUpdateShiftEnd(){
  const prof = currentProfile();
  if(!prof) return;
  ensureAchievements(prof);
  const t0 = prof.totals;
  const lv = prof.levels[state.level];
  t0.sessions++;
  lv.sessions++;
  lv.lastPlay = new Date().toISOString();
  if(state.revenue > lv.bestRevenue) lv.bestRevenue = state.revenue;
  if(state.ordersDone > lv.bestOrders) lv.bestOrders = state.ordersDone;
  if(state.shiftQuestions>0 && state.shiftCorrect===state.shiftQuestions) unlockAchievement('perfectRun');
  if(state.level==='challenge' && state.shiftOrders.length>0 && state.shiftOrders.every(o=>o.ecoMet)) unlockAchievement('greenManager');
  prof.lastLoginAt = new Date().toISOString();
  saveProfile(prof);
  checkAchievements({});
}

function startTimer(){

    state.timeLeft--;
    if(state.timeLeft <= 0){
      state.timeLeft = 0;

    if(timerEl){
      const mm = Math.floor(state.timeLeft/60), ss = state.timeLeft%60;
      timerEl.textContent = mm+':'+String(ss).padStart(2,'0');
      const card = timerEl.closest('.biz-card.timer');
      if(card) card.classList.toggle('warn', state.timeLeft<=30);
    }

  if(state.timerId){ clearInterval(state.timerId); state.timerId = null; }
}
function endShift(){
  stopTimer();
  state.screen = 'report';
  if(state.account){
    profileUpdateShiftEnd();
  } else if(state.level && state.ordersDone > 0){
    const acc = state.shiftQuestions > 0 ? Math.round(state.shiftCorrect / state.shiftQuestions * 100) : 0;

      name: displayGuestName(),
      level: state.level,
      revenue: state.revenue,
      orders: state.ordersDone,
      accuracy: acc,
      playedAt: new Date().toISOString()
    });
  }
  renderReport();
}

function ecoRating(){
  if(state.level !== 'challenge') return null;
  const orders = state.shiftOrders;
  if(orders.length === 0) return { name:STR.rating1, rank:1 };
  const ecoMetCount = orders.filter(o=>o.ecoMet).length;
  const rate = ecoMetCount / orders.length;
  const highRevenue = state.revenue >= 100;
  if(highRevenue && rate === 1) return { name:STR.rating5, rank:5 };
  if(rate >= 0.8) return { name:STR.rating4, rank:4 };
  if(rate >= 0.6) return { name:STR.rating3, rank:3 };
  return { name:STR.rating1, rank:1 };
}

function topStep(){

  Object.keys(s).forEach(k => { if(s[k]>bestN){ bestN=s[k]; best=k; } });
  if(!best) return t(STR.notReady);
  return t(names[best]||STR.stepExpense) + '（'+bestN+' 次）';

  Object.keys(s).forEach(k => { if(s[k]>bestN){ bestN=s[k]; best=k; } });

function generateFeedback(prof){
  const m = prof.mistakes;
  const out = [];
  const stepTotal = ['foodSelection','expenseExpression','changeExpression','operationOrder','finalAnswer','ecoRequirement'].reduce((s,k)=>s+(m[k]||0),0);
  if(stepTotal === 0){ return [t(STR.feedbackNone)]; }
  const stepNames = [['changeExpression',T('你最近最常在「找錢」步驟出錯。記住：找錢＝客人付款−食物開銷。','You most often make mistakes in the "change" step. Remember: change = amount paid − food cost.')],
    ['expenseExpression',T('你最近最常在「食物開銷」步驟出錯。記住：多份食物要用乘法。','You most often make mistakes in the "cost" step. Remember to use multiplication for multiple portions.')],
    ['operationOrder',T('你最近最常在「運算次序」出錯。記住：先乘後加減，括號內先算。','You most often make mistakes in the order of operations. Remember: multiply before add/subtract, brackets first.')],
    ['finalAnswer',T('你最近最常在「找錢答案」出錯。記住：按照運算次序逐步計算。','You most often make mistakes in the "change answer" step. Follow the order of operations step by step.')],
    ['ecoRequirement',T('你在環保達人模式的數學正確率很高，但要多留意包裝的環保程度。','Your maths accuracy is high in Eco mode, but watch the packaging eco level.')],
    ['foodSelection',T('你最近在「選擇食物」出錯，要細心核對客人的點單要求。','You often make mistakes choosing food — check the customer\'s order carefully.')]];
  let worst='', worstN=-1;
  stepNames.forEach(p => { const n = m[p[0]]||0; if(n>worstN){ worstN=n; worst=p; } });
  if(worst) out.push(t(worst[1]));
  if((m.missingMultiplication||0) > 0) out.push(t(T('你已掌握加減法，可以多練習有兩份相同食物的乘加算式。','You have mastered addition/subtraction — practise multiply-add expressions with two portions of the same food.')));
  if((m.reversedSubtraction||0) > 0) out.push(t(T('注意被減數和減數的位置：應該用「付款金額 − 開銷」。','Watch the order of subtraction: use "amount paid − cost".')));
  if((m.replacedExpressionWithTotal||0) > 0) out.push(t(T('你有時會在找錢算式中直接寫商品總額。下次請把商品的完整計算式放在圓括號內。','Sometimes you write the total directly in the change expression. Next time, put the full food-cost expression inside round brackets.')));
  return out.slice(0,4);
}

function hashPin(pin){
  if(!pin) return Promise.resolve('');
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode('cct_v5_'+pin))
    .then(buf => Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''));
}
