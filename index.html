/* ========================= 事件代理 ========================= */
document.addEventListener('click', function(e){
  const t0 = e.target && e.target.nodeType === 1 ? e.target : null;
  if(!t0) return;
  const hit = sel => t0.closest(sel);

  let el;
  if((el = hit('[data-lang]'))){
    state.lang = el.getAttribute('data-lang');
    try{ localStorage.setItem(STORE_LANG, state.lang); }catch(err){}
    if(state.screen === 'flow' && state.flow.step === 3){
      state.flow.mcOptions = [];
    }
    toast(t(STR.toastLang));
    render();
    return;
  }
  if((el = hit('[data-nav]'))){ navigate(el.getAttribute('data-nav')); return; }
  if((el = hit('[data-lb-tab]'))){ state.lbLevel = el.getAttribute('data-lb-tab'); renderLeaderboard(); return; }
  if((el = hit('[data-lb-level]'))){ state.lbLevel = el.getAttribute('data-lb-level'); state.screen = 'leaderboard'; renderLeaderboard(); return; }
  if((el = hit('[data-level]'))){ startLevel(el.getAttribute('data-level'), { showRules:true }); return; }
  if((el = hit('[data-rules]'))){ openRules(); return; }
  if((el = hit('[data-close]'))){ closeModal(); return; }
  if(t0 === overlay){ closeModal(); return; }
  if((el = hit('[data-home]'))){
    if(state.screen === 'game' || state.screen === 'flow'){
      openModal({
        hero:'⏹', title:t(STR.endShiftConfirm),
        actions:
          '<button class="btn btn-primary" data-confirm-home>'+t(STR.endShiftYes)+'</button>' +
          '<button class="btn btn-ghost" data-close>'+t(STR.endShiftNo)+'</button>'
      });
    } else {
      stopTimer();
      state.screen = 'start';
      render();
    }
    return;
  }
  if((el = hit('[data-confirm-home]'))){ closeModal(); stopTimer(); state.screen='start'; render(); return; }
  if((el = hit('[data-end-shift]'))){
    if(state.screen === 'game' || state.screen === 'flow'){
      openModal({
        hero:'⏹', title:t(STR.endShiftConfirm),
        actions:
          '<button class="btn btn-primary" data-confirm-end>'+t(STR.endShiftYes)+'</button>' +
          '<button class="btn btn-ghost" data-close>'+t(STR.endShiftNo)+'</button>'
      });
    } else {
      endShift();
    }
    return;
  }
  if((el = hit('[data-confirm-end]'))){ closeModal(); endShift(); return; }

  /* 餐牌操作 */
  if((el = hit('[data-filter]'))){ state.filter = el.getAttribute('data-filter'); renderGame(); return; }
  if((el = hit('[data-add]'))){
    const id = el.getAttribute('data-add');
    const c = canAdd(id);
    if(!c.ok){ toast(c.msg); return; }
    state.cart[id] = (state.cart[id]||0)+1;
    toast(t(STR.toastAdded));
    renderGame();
    return;
  }
  if((el = hit('[data-inc]'))){
    const id = el.getAttribute('data-inc');
    const c = canAdd(id);
    if(!c.ok){ toast(c.msg); return; }
    state.cart[id] = (state.cart[id]||0)+1;
    renderGame();
    return;
  }
  if((el = hit('[data-dec]'))){
    const id = el.getAttribute('data-dec');
    if(!state.cart[id]) return;
    if(state.cart[id]===1) delete state.cart[id]; else state.cart[id]--;
    renderGame();
    return;
  }
  if((el = hit('[data-remove]'))){
    const id = el.getAttribute('data-remove');
    if(state.cart[id]){ delete state.cart[id]; toast(t(STR.toastRemoved)); }
    renderGame();
    return;
  }
  if((el = hit('[data-jump-tray]'))){
    const tray = document.querySelector('.side-panel');
    if(tray) tray.scrollIntoView({ behavior:'smooth', block:'start' });
    return;
  }
  if((el = hit('[data-checkout]'))){
    if(entries().length === 0){ toast(t(STR.toastNeedFood)); return; }
    const chk = preCheckoutCheck();
    if(!chk.ok){
      toast(chk.msg);
      profileUpdateMistake('foodSelection');
      state.shiftMistakeStep['foodSelection'] = (state.shiftMistakeStep['foodSelection']||0)+1;
      return;
    }
    state.screen = 'flow';
    state.flow = { step:1, expr:'', answer:'', status:'', msg:'', hint:false, mcOptions:[], mcAnswered:false, mcChosen:null, _mcType:null, _mcCorrectIndex:0, orderAnswers:{1:null,2:null,3:null,4:null} };
    render();
    window.scrollTo({ top:0 });
    return;
  }

  /* 翻页流程操作 */
  if((el = hit('[data-flow-exit]'))){
    state.screen = 'game';
    render();
    window.scrollTo({ top:0 });
    return;
  }
  if((el = hit('[data-back-to-tray]'))){
    closeModal();
    state.screen = 'game';
    render();
    window.scrollTo({ top:0 });
    return;
  }
  if((el = hit('[data-flow-token]'))){
    if(state.flow.status === 'ok') return;
    const tok = el.getAttribute('data-flow-token');
    const f = state.flow;
    if(tok === 'back'){
      if(f.expr){
        if(/\d$/.test(f.expr)){ f.expr = f.expr.replace(/\d+$/, ''); }
        else { f.expr = f.expr.slice(0, -1); }
      }
    } else if(tok === 'clear'){
      f.expr = '';
    } else {
      f.expr = (f.expr||'') + tok;
    }
    f.status = ''; f.msg = '';
    renderFlowStepCard();
    return;
  }
  if((el = hit('[data-flow-check]'))){
    if(state.flow.step === 1 || state.flow.step === 2) checkFlowExpression();
    else if(state.flow.step === 4) checkFlowAnswer();
    return;
  }
  if((el = hit('[data-flow-next]'))){
    advanceFlow();
    return;
  }
  if((el = hit('[data-flow-hint]'))){
    state.flow.hint = !state.flow.hint;
    renderFlowStepCard();
    return;
  }
  if((el = hit('[data-mc]'))){
    answerMC(Number(el.getAttribute('data-mc')));
    return;
  }
  if((el = hit('[data-next-customer]'))){ nextCustomer(); return; }
  if((el = hit('[data-view-record]'))){ closeModal(); endShift(); return; }
  if((el = hit('[data-again]'))){ startLevel(state.level, { showRules:false }); return; }

  /* 账号页面操作 */
  if((el = hit('[data-acc-create]'))){ accCreate(); return; }
  if((el = hit('[data-acc-save]'))){ accSave(); return; }
  if((el = hit('[data-acc-logout]'))){ state.account = null; setCurrentAccountId(null); render(); return; }
  if((el = hit('[data-acc-delete]'))){ accDelete(); return; }
  if((el = hit('[data-acc-export]'))){ accExport(); return; }
  if((el = hit('[data-acc-import]'))){ accImport(); return; }
  if((el = hit('[data-acc-switch]'))){ switchAccountFlow(); return; }
  if((el = hit('[data-switch-to]'))){
    const id = el.getAttribute('data-switch-to');
    const acc = loadAccounts();
    const prof = acc[id];
    if(!prof){ toast(t(STR.toastNoAccount)); return; }
    if(prof.pinHash){
      closeModal();
      openModal({
        hero:'🔑', title:t(STR.accLogin),
        body:'<div class="field"><label>'+t(STR.accPin)+'</label><input id="loginPin" inputmode="numeric" maxlength="4" placeholder="0000"></div>',
        actions:'<button class="btn btn-primary" data-verify-pin="'+id+'">'+t(STR.accLogin)+'</button><button class="btn btn-ghost" data-close>'+t(STR.modalClose)+'</button>'
      });
    } else {
      closeModal();
      state.account = id;
      setCurrentAccountId(id);
      prof.lastLoginAt = new Date().toISOString();
      saveProfile(prof);
      render();
    }
    return;
  }
  if((el = hit('[data-verify-pin]'))){
    const id = el.getAttribute('data-verify-pin');
    const pinEl = document.getElementById('loginPin');
    const pin = pinEl ? pinEl.value : '';
    hashPin(pin).then(function(hash){
      const acc = loadAccounts();
      const prof = acc[id];
      if(!prof || prof.pinHash !== hash){ toast(t(STR.toastPinWrong)); return; }
      closeModal();
      state.account = id;
      setCurrentAccountId(id);
      prof.lastLoginAt = new Date().toISOString();
      saveProfile(prof);
      render();
    });
    return;
  }
});

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && !overlay.hidden){ closeModal(); return; }
  if(state.screen === 'flow' && !overlay.hidden) return;
  if(state.screen === 'flow'){
    const f = state.flow;
    if(f.step === 1 || f.step === 2){
      if(e.key === 'Enter'){
        if(f.status === 'ok') advanceFlow();
        else checkFlowExpression();
        return;
      }
      if(f.status === 'ok') return;
      if(e.key === 'Backspace'){
        if(f.expr){
          if(/\d$/.test(f.expr)) f.expr = f.expr.replace(/\d+$/, '');
          else f.expr = f.expr.slice(0,-1);
          f.status=''; f.msg=''; renderFlowStepCard();
        }
        e.preventDefault();
        return;
      }
      if(e.key === '+'){ f.expr=(f.expr||'')+'+'; f.status=''; f.msg=''; renderFlowStepCard(); return; }
      if(e.key === '-'){ f.expr=(f.expr||'')+'−'; f.status=''; f.msg=''; renderFlowStepCard(); return; }
      if(e.key === '*'){ f.expr=(f.expr||'')+'×'; f.status=''; f.msg=''; renderFlowStepCard(); return; }
      if(e.key === '/'){ f.expr=(f.expr||'')+'÷'; f.status=''; f.msg=''; renderFlowStepCard(); return; }
      if(e.key === '(' || e.key === ')'){ f.expr=(f.expr||'')+e.key; f.status=''; f.msg=''; renderFlowStepCard(); return; }
    } else if(f.step === 3 && e.key === 'Enter' && f.status === 'ok'){
      advanceFlow();
    } else if(f.step === 4 && e.key === 'Enter' && f.status === 'ok'){
      advanceFlow();
    }
  }
});

function navigate(target){
  if(target === 'start'){ state.screen='start'; render(); return; }
  if(target === 'leaderboard'){ stopTimer(); state.screen='leaderboard'; renderLeaderboard(); return; }
  if(target === 'profile'){ stopTimer(); state.screen='profile'; renderProfile(); return; }
  if(target === 'achievements'){ stopTimer(); state.screen='achievements'; renderAchievements(); return; }
  if(target === 'account'){ stopTimer(); state.screen='account'; renderAccount(); return; }
  if(target === 'rules'){ openRules(); return; }
  if(target === 'game-select'){ state.screen='start'; render(); return; }
}

/* 账号辅助函数 */
function accCreate(){
  const nameEl = document.getElementById('accName');
  const pinEl = document.getElementById('accPin');
  const name = (nameEl?nameEl.value:'').trim();
  const avatar = state._avatar || '🧑';
  const pin = pinEl ? pinEl.value.trim() : '';
  if(!name){ toast(t(STR.accName)); return; }
  if(pin && !/^\d{4}$/.test(pin)){ toast(t(STR.accPin)); return; }
  hashPin(pin).then(function(hash){
    createAccount(name, avatar, hash);
    state._avatar = null;
  });
}
function accSave(){
  const prof = currentProfile();
  if(!prof) return;
  const nameEl = document.getElementById('accName');
  const pinEl = document.getElementById('accPin');
  const name = (nameEl?nameEl.value:'').trim();
  if(!name){ toast(t(STR.accName)); return; }
  prof.name = name;
  if(state._avatar) prof.avatar = state._avatar;
  const pin = pinEl ? pinEl.value.trim() : '';
  if(pin){
    if(!/^\d{4}$/.test(pin)){ toast(t(STR.accPin)); return; }
    hashPin(pin).then(function(hash){
      prof.pinHash = hash;
      saveProfile(prof);
      state._avatar = null;
      toast(t(STR.toastSaved));
      render();
    });
  } else {
    saveProfile(prof);
    state._avatar = null;
    toast(t(STR.toastSaved));
    render();
  }
}
function accDelete(){
  openModal({
    hero:'⚠️', title:t(STR.accDelete), sub:t(STR.accDeleteConfirm),
    actions:
      '<button class="btn btn-primary" data-confirm-del>'+t(STR.accDelete)+'</button>' +
      '<button class="btn btn-ghost" data-close>'+t(STR.modalClose)+'</button>'
  });
  setTimeout(function(){
    const btn = modalBox.querySelector('[data-confirm-del]');
    if(btn) btn.addEventListener('click', function(){
      const acc = loadAccounts();
      delete acc[state.account];
      saveAccounts(acc);
      state.account = null;
      setCurrentAccountId(null);
      closeModal();
      toast(t(STR.toastDeleted));
      render();
    });
  }, 40);
}
function accExport(){
  const prof = currentProfile();
  if(!prof){ toast(t(STR.toastNoAccount)); return; }
  const data = JSON.stringify(prof, null, 2);
  const blob = new Blob([data], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cha_chaan_teng_'+prof.name+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  toast(t(STR.toastExport));
}
function accImport(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json';
  inp.onchange = function(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      try{
        const imported = JSON.parse(ev.target.result);
        if(!imported || !imported.name || !imported.levels) throw new Error('Invalid');
        openModal({
          hero:'📥', title:t(STR.accImport), sub:t(STR.accImportConfirm),
          actions:
            '<button class="btn btn-primary" data-confirm-imp>'+t(STR.accImport)+'</button>' +
            '<button class="btn btn-ghost" data-close>'+t(STR.modalClose)+'</button>'
        });
        setTimeout(function(){
          const btn = modalBox.querySelector('[data-confirm-imp]');
          if(btn) btn.addEventListener('click', function(){
            const acc = loadAccounts();
            const id = imported.id || ('acc_'+Date.now());
            imported.id = id;
            acc[id] = imported;
            saveAccounts(acc);
            state.account = id;
            setCurrentAccountId(id);
            closeModal();
            toast(t(STR.toastImport));
            render();
          });
        }, 40);
      }catch(err){
        toast('檔案格式無效 / Invalid file');
      }
    };
    reader.readAsText(file);
  };
  inp.click();
}

function render(){
  if(state.screen === 'game' && state.level) renderGame();
  else if(state.screen === 'flow') renderFlowStepCard();
  else if(state.screen === 'report') renderReport();
  else if(state.screen === 'leaderboard') renderLeaderboard();
  else if(state.screen === 'profile') renderProfile();
  else if(state.screen === 'achievements') renderAchievements();
  else if(state.screen === 'account') renderAccount();
  else renderStart();
}

/* ========================= 自检模式（?test=1） ========================= */
function runSelfTests(){
  const log = [];
  let pass = 0, fail = 0;
  function ok(name, cond){
    if(cond){ pass++; log.push('PASS: '+name); }
    else { fail++; log.push('FAIL: '+name); }
  }

  /* --- 基础数学解析 --- */
  ok('基础表达式求值', evalExpr('30 - (8 + 14)') === 8);
  ok('含乘法混合运算', evalExpr('50 - (2 × 8 + 15)') === 19);
  ok('含除法运算', evalExpr('60 - (30 ÷ 2 + 10)') === 35);
  ok('圆括号校验 - 合法', parseExprAST('30 - (8 + 14)') !== null);
  ok('圆括号校验 - 不匹配返回 null', parseExprAST('30 - (8 + 14') === null);
  ok('除以零返回 null', evalExpr('10 ÷ 0') === null);

  /* --- 订单生成与验证 --- */
  state.level = 'basic';
  const ob = genOrder('basic');
  ok('basic 生成 2 款食物', ob.request.items.length === 2);
  ok('basic 每款 1 份', ob.request.items.every(x=>x.qty===1));

  state.level = 'advanced';
  const oa = genOrder('advanced');
  ok('advanced 有至少 1 款 >= 2 份', oa.request.items.some(x=>x.qty>=2));

  state.level = 'challenge';
  const oc = genOrder('challenge');
  ok('challenge 为推荐 3 份模式', oc.request.isRecommend === true && oc.request.totalQty === 3);
  const dineInSnacks = FOODS.filter(f => f.tags.includes('snack') && f.eco === 3 && f.packIcon === '🍽️');
  const dineInDrinks = FOODS.filter(f => f.tags.includes('drink') && f.eco === 3 && f.packIcon === '🍽️');
  ok('小食包含至少 3 款無包裝堂食食物', dineInSnacks.length >= 3);
  ok('飲品包含至少 3 款無包裝堂食食物', dineInDrinks.length >= 3);
  const ecoPassDineIn = evaluateChallengeEco([
    { food:FOOD_BY_ID.macaroni, qty:1 },
    { food:FOOD_BY_ID.buttertoast, qty:1 },
    { food:FOOD_BY_ID.hotlemonwater, qty:1 }
  ], { dineIn:true });
  ok('堂食無包裝推薦組合判定通過', ecoPassDineIn.ok === true);
  const ecoFailDineIn = evaluateChallengeEco([
    { food:FOOD_BY_ID.macaroni, qty:1 },
    { food:FOOD_BY_ID.eggtart, qty:1 },
    { food:FOOD_BY_ID.hotlemonwater, qty:1 }
  ], { dineIn:true });
  ok('堂食誤選紙袋包裝食物判定不通過', ecoFailDineIn.ok === false);

  /* --- 表达式结构检查 --- */
  state.level = 'advanced';
  state.cart = { pineapple:2, lemontea:1 };
  state.customer = { type:'aunty', paid:50, request:{ items:[{id:'pineapple',qty:2},{id:'lemontea',qty:1}], totalQty:3 } };
  const astOk = parseExprAST('50 − (2 × 8 + 15)');
  ok('第二步正确算式求值=19', evalAST(astOk) === 19);
  const astRev = parseExprAST('(2 × 8 + 15) − 50');
  ok('被减数减数调转求值=-19', evalAST(astRev) === -19);

  /* --- 进阶/挑战同价合并乘法检查 --- */
  state.level = 'challenge';
  state.cart = { eggtart:1, fishball:1, freshmilk:1 };
  state.customer = { type:'uncle', paid:40, request:{ items:[{id:'eggtart',qty:1},{id:'fishball',qty:1},{id:'freshmilk',qty:1}], totalQty:3 } };
  const entSamePrice = entries();
  ok('同价订单预期数字为 [7, 10, 2]', sameMultiset(expectedSpendNumbers(entSamePrice), [7, 10, 2]));
  ok('同价订单数字总数=4', numbersOf(entSamePrice) === 4);
  state.flow = { step:1, expr:'7+10×2', status:'', msg:'', orderAnswers:{} };
  checkFlowExpression();
  ok('同价订单第一步 7+10×2 通过', state.flow.status === 'ok');
  state.flow = { step:1, expr:'7+10+10', status:'', msg:'', orderAnswers:{} };
  checkFlowExpression();
  ok('同价订单第一步连加 7+10+10 被拦截', state.flow.status === 'bad');
  state.flow = { step:2, expr:'40−(7+10×2)', status:'', msg:'', orderAnswers:{} };
  checkFlowExpression();
  ok('同价订单第二步 40−(7+10×2) 通过', state.flow.status === 'ok');
  state.flow = { step:2, expr:'40−(7+10+10)', status:'', msg:'', orderAnswers:{} };
  checkFlowExpression();
  ok('同价订单第二步连加 40−(7+10+10) 被拦截', state.flow.status === 'bad');

  /* --- 起始页与难度页规则弹窗检查 --- */
  state.screen = 'start';
  state.level = 'basic';
  openRules();
  ok('起始页規則彈窗不包含 .rules-card-box', !modalBox.querySelector('.rules-card-box'));
  state.screen = 'game';
  state.level = 'basic';
  openRules();
  ok('難度頁規則彈窗保留 .rules-card-box', !!modalBox.querySelector('.rules-card-box'));
  closeModal();

  /* --- 重置状态 --- */
  state.level = null; state.cart = {}; state.customer = null; state.screen = 'start';

  const summary = 'Self-test: ' + pass + ' passed, ' + fail + ' failed';
  console.log(summary + '\n' + log.join('\n'));
  const box = document.createElement('pre');
  box.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:300;max-width:90vw;max-height:50vh;overflow:auto;background:#1e1e1e;color:#9ef2b8;padding:12px 16px;border-radius:12px;font-size:13px;line-height:1.5;box-shadow:0 8px 30px rgba(0,0,0,.4)';
  box.textContent = summary + '\n\n' + log.join('\n');
  document.body.appendChild(box);
}

/* ========================= 启动 ========================= */
function loadPrefs(){
  try{
    const l = localStorage.getItem(STORE_LANG);
    if(l==='zh'||l==='en') state.lang = l;
    state.guestName = getGuestName();
    state.account = getCurrentAccountId();
    if(state.account){
      const acc = loadAccounts();
      if(!acc[state.account]) state.account = null;
    }
  }catch(e){}
}
loadPrefs();
render();
if(/[?&]test=1/.test(location.search)) runSelfTests();
})();
